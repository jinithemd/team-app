<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Oswald:wght@400;600&family=Noto+Serif+Malayalam:wght@500;800&family=Manjari:wght@700&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="captions.js"></script>
<script>
const W = 1080, H = 1920, FPS = 30;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

/* palette */
const INK = '#16100a', CREAM = '#fff3dc', DIM = '#ffd9a0', AMBER = '#f5a524',
      AMBER2 = '#c8620e', FOAM = '#fffaf0', RUST = '#e2482f', IRON = '#2c2a33', GOLD = '#ffcf4a';
/* per-scene backgrounds: [inner, outer] radial, or [top, mid, bottom] vertical sky */
const BGS = [
  ['#17708a', '#06303d'], ['#a3203a', '#3d0816'], ['#ff9a4d', '#8a3d8f', '#1d1747'], ['#9a4a14', '#2e1206'],
  ['#b0581a', '#3a1608'], ['#1f4f9a', '#0a1a3a'], ['#138a62', '#04301f'], ['#1b4d8c', '#0a2246'],
  ['#4b2a7a', '#160b2a'], ['#8f1d2c', '#2e0810'], ['#1f4fc4', '#0b1c55'], ['#0f8a8f', '#05343a'],
  ['#d9480f', '#6b1410'], ['#8b2fc9', '#c2185b']];
let CUR_BG = BGS[0];
const ML = "'Noto Serif Malayalam', 'Manjari', serif";
const ABRIL = "'Abril Fatface'", OSW = "'Oswald'";

/* helpers */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeIn = x => x * x * x;
const easeIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.9, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const elastic = x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (2 * Math.PI / 3)) + 1;
function rnd(i) { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }

function text(s, x, y, size, font, color, align = 'center', alpha = 1, weight = '') {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = color; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.font = `${weight} ${size}px ${font}`; ctx.fillText(s, x, y); ctx.restore();
}
/* text that pops in with an overshoot, starting at time t0 */
function pop(s, x, y, size, font, color, t, t0, dur = .45, weight = '', rot = 0) {
  const p = seg(t, t0, t0 + dur); if (p <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot * (1 - p)); const k = back(p); ctx.scale(k, k);
  ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
  text(s, 0, 0, size, font, color, 'center', clamp(p * 2), weight); ctx.restore();
}
function spaced(s, x, y, size, font, color, spacing, alpha = 1, weight = '') {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = `${weight} ${size}px ${font}`;
  ctx.fillStyle = color; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  if ('letterSpacing' in ctx) { ctx.letterSpacing = spacing + 'px'; ctx.fillText(s, x + spacing / 2, y); } else ctx.fillText(s, x, y);
  ctx.restore();
}

/* grain tiles */
const grains = [];
for (let g = 0; g < 6; g++) {
  const c = document.createElement('canvas'); c.width = 270; c.height = 480;
  const x = c.getContext('2d'); const id = x.createImageData(270, 480);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255;
    id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  x.putImageData(id, 0, 0); grains.push(c);
}

/* ---------- reusable drawings ---------- */
function background() {
  let g;
  if (CUR_BG.length === 3) { g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, CUR_BG[2]); g.addColorStop(.35, CUR_BG[1]); g.addColorStop(.62, CUR_BG[0]); g.addColorStop(.63, '#2a1640'); g.addColorStop(1, '#120b24'); }
  else { g = ctx.createRadialGradient(W / 2, H * .42, 80, W / 2, H * .5, H * .85); g.addColorStop(0, CUR_BG[0]); g.addColorStop(1, CUR_BG[1]); }
  ctx.fillStyle = g; ctx.fillRect(-200, -200, W + 400, H + 400);
}
function waveY(x, level, t, amp, speed) {
  return level + Math.sin(x / 90 + t * speed) * amp + Math.sin(x / 37 - t * speed * 1.7) * amp * .35;
}
function wave(level, t, color = AMBER, amp = 22, speed = 2.2, foam = true, color2 = AMBER2) {
  ctx.save();
  ctx.beginPath(); ctx.moveTo(-200, H + 200);
  for (let x = -200; x <= W + 200; x += 10) ctx.lineTo(x, waveY(x, level, t, amp, speed));
  ctx.lineTo(W + 200, H + 200); ctx.closePath();
  const g = ctx.createLinearGradient(0, level, 0, level + 900); g.addColorStop(0, color); g.addColorStop(1, color2);
  ctx.fillStyle = g; ctx.fill();
  // light streaks inside the liquid
  ctx.globalAlpha = .12; ctx.fillStyle = '#fff3d0';
  for (let i = 0; i < 5; i++) { const x = ((t * 60 + i * 260) % (W + 300)) - 150;
    ctx.beginPath(); ctx.moveTo(x, level + 40); ctx.lineTo(x + 60, level + 40); ctx.lineTo(x - 200, H + 200); ctx.lineTo(x - 260, H + 200); ctx.fill(); }
  if (foam) {
    ctx.fillStyle = FOAM; ctx.globalAlpha = .92;
    for (let i = 0; i < 64; i++) {
      const x = (i / 63) * (W + 120) - 60 + Math.sin(t * 2 + i) * 6;
      ctx.beginPath(); ctx.arc(x, waveY(x, level, t, amp, speed) + 4, 14 + 10 * rnd(i), 0, 7); ctx.fill();
    }
    ctx.globalAlpha = .55;
    for (let i = 0; i < 46; i++) {
      const bx = rnd(i + 3) * W, rise = (t * 140 * (0.5 + rnd(i)) + rnd(i + 7) * 900) % (H - level + 200);
      const by = H + 100 - rise; if (by < level + 24) continue;
      ctx.beginPath(); ctx.arc(bx + Math.sin(t * 3 + i) * 8, by, 3 + 7 * rnd(i + 9), 0, 7); ctx.fill();
    }
  }
  ctx.restore();
}
/* ballistic droplets: spray from (cx,cy) starting at t0 */
function splash(cx, cy, t, t0, n, seed, spread = 1, color = AMBER, up = 1) {
  const dt = t - t0; if (dt < 0 || dt > 2.2) return;
  ctx.save();
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (rnd(seed + i) - .5) * Math.PI * spread;
    const v = 500 + 900 * rnd(seed + i + 50);
    const x = cx + Math.cos(a) * v * dt, y = cy + Math.sin(a) * v * dt * up + 1400 * dt * dt;
    const r = 4 + 10 * rnd(seed + i + 90);
    ctx.globalAlpha = clamp(1 - dt / 2.2); ctx.fillStyle = i % 5 ? color : FOAM;
    ctx.beginPath(); ctx.ellipse(x, y, r, r * 1.4, a, 0, 7); ctx.fill();
  }
  ctx.restore();
}
/* ink splatter for stamps */
function ink(cx, cy, t, t0, seed) {
  const p = seg(t, t0, t0 + .25); if (p <= 0) return;
  ctx.save(); ctx.fillStyle = RUST; ctx.globalAlpha = .75;
  for (let i = 0; i < 18; i++) { const a = rnd(seed + i) * 7, d = (180 + 220 * rnd(seed + i + 20)) * easeOut(p);
    ctx.beginPath(); ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d * .7, 3 + 9 * rnd(seed + i + 40), 0, 7); ctx.fill(); }
  ctx.restore();
}
function vat(cx, bottom, w, h, hoopShift = 0, hoopIdx = -1, hideHoop = false) {
  ctx.save();
  const top = bottom - h;
  const g = ctx.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0);
  g.addColorStop(0, '#6b3a14'); g.addColorStop(.45, '#c07a3a'); g.addColorStop(1, '#5a2e0e');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(cx - w / 2 * .92, top); ctx.lineTo(cx + w / 2 * .92, top);
  ctx.lineTo(cx + w / 2, bottom); ctx.lineTo(cx - w / 2, bottom); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(20,10,4,.55)'; ctx.lineWidth = 3;
  for (let i = 1; i < 12; i++) { const f = i / 12 - .5;
    ctx.beginPath(); ctx.moveTo(cx + f * w * .92, top); ctx.lineTo(cx + f * w, bottom); ctx.stroke(); }
  for (let i = 0; i < 6; i++) {
    if (i === hoopIdx && hideHoop) continue;
    let y = top + h * (0.08 + i * 0.17); if (i === hoopIdx) y += hoopShift;
    const ww = w * (0.92 + 0.08 * ((y - top) / h));
    ctx.fillStyle = IRON; ctx.fillRect(cx - ww / 2 - 6, y - 9, ww + 12, 18);
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(cx - ww / 2 - 6, y - 9, ww + 12, 4);
    for (let k = 0; k < 6; k++) { ctx.fillStyle = '#5a534a'; ctx.beginPath(); ctx.arc(cx - ww / 2 + (k + .5) * ww / 6, y, 3, 0, 7); ctx.fill(); }
  }
  ctx.fillStyle = '#2b180a'; ctx.fillRect(cx - w / 2 * .92 - 8, top - 14, w * .92 + 16, 18);
  ctx.restore();
}
function person(x, baseY, s = 1, color = '#120c06', walk = 0) {
  ctx.save(); ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, baseY - 70 * s, 11 * s, 0, 7); ctx.fill();
  ctx.fillRect(x - 6 * s, baseY - 92 * s, 12 * s, 6 * s); ctx.fillRect(x - 4 * s, baseY - 104 * s, 8 * s, 12 * s);
  ctx.fillRect(x - 13 * s, baseY - 58 * s, 26 * s, 34 * s);
  const sw = Math.sin(walk) * 6 * s;
  ctx.fillRect(x - 11 * s + sw, baseY - 26 * s, 8 * s, 26 * s); ctx.fillRect(x + 3 * s - sw, baseY - 26 * s, 8 * s, 26 * s);
  ctx.restore();
}
function cart(x, baseY, t) {
  ctx.save(); ctx.fillStyle = '#140d2a';
  // horse
  const bob = Math.sin(t * 9) * 4;
  ctx.fillRect(x + 170, baseY - 120 + bob, 120, 50); ctx.fillRect(x + 270, baseY - 160 + bob, 26, 60);
  ctx.beginPath(); ctx.ellipse(x + 300, baseY - 165 + bob, 30, 16, -.4, 0, 7); ctx.fill();
  for (let k = 0; k < 4; k++) { const ph = t * 9 + k * 1.6; ctx.save(); ctx.translate(x + 180 + k * 32, baseY - 74 + bob); ctx.rotate(Math.sin(ph) * .35); ctx.fillRect(-5, 0, 10, 74); ctx.restore(); }
  // cart with barrels
  ctx.fillRect(x - 60, baseY - 110, 210, 40);
  for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.ellipse(x - 30 + k * 64, baseY - 140, 28, 32, 0, 0, 7); ctx.fill(); }
  for (const wx of [x - 20, x + 110]) { ctx.save(); ctx.translate(wx, baseY - 40); ctx.rotate(t * 4);
    ctx.lineWidth = 6; ctx.strokeStyle = '#140d2a'; ctx.beginPath(); ctx.arc(0, 0, 38, 0, 7); ctx.stroke();
    for (let s = 0; s < 4; s++) { ctx.rotate(Math.PI / 4); ctx.beginPath(); ctx.moveTo(-38, 0); ctx.lineTo(38, 0); ctx.stroke(); } ctx.restore(); }
  ctx.restore();
}
function skyline(baseY, t, alpha = 1, par = 0) {
  ctx.save(); ctx.globalAlpha = alpha;
  // far layer
  ctx.fillStyle = '#4a2f6e';
  for (let i = 0; i < 14; i++) { const x = i * 85 - 40 - par * .4, hh = 140 + 120 * rnd(i + 30); ctx.fillRect(x, baseY - 120 - hh, 70, hh + 120); }
  ctx.fillStyle = '#1b1238';
  const bs = [[0, 180], [90, 240], [170, 200], [250, 300], [340, 220], [430, 260], [700, 230], [790, 300], [880, 210], [960, 270]];
  ctx.save(); ctx.translate(-par, 0);
  for (const [x, hh] of bs) { ctx.fillRect(x, baseY - hh, 100, hh);
    ctx.fillRect(x + 20, baseY - hh - 40, 14, 40); ctx.fillRect(x + 60, baseY - hh - 28, 10, 28);
    // lit windows flicker
    for (let k = 0; k < 4; k++) { if (rnd(x + k + Math.floor(t * 2)) > .7) { ctx.fillStyle = 'rgba(255,200,90,.9)'; ctx.fillRect(x + 18 + (k % 2) * 40, baseY - hh + 40 + Math.floor(k / 2) * 60, 16, 22); ctx.fillStyle = '#1b1238'; } } }
  ctx.beginPath(); ctx.arc(590, baseY - 330, 95, Math.PI, 0); ctx.fill();
  ctx.fillRect(495, baseY - 330, 190, 330); ctx.fillRect(575, baseY - 470, 30, 60);
  ctx.beginPath(); ctx.arc(590, baseY - 478, 14, 0, 7); ctx.fill();
  ctx.fillRect(120, baseY - 520, 24, 340); ctx.beginPath(); ctx.moveTo(108, baseY - 520); ctx.lineTo(132, baseY - 640); ctx.lineTo(156, baseY - 520); ctx.fill();
  for (let i = 0; i < 10; i++) {
    const sx = bs[i][0] + 27, sy = baseY - bs[i][1] - 40;
    for (let k = 0; k < 5; k++) {
      const p = (t * .35 + k / 5 + rnd(i)) % 1;
      ctx.globalAlpha = alpha * (1 - p) * .16; ctx.fillStyle = '#9a8a72';
      ctx.beginPath(); ctx.arc(sx + p * 60 + Math.sin(p * 6 + i) * 10, sy - p * 260, 14 + p * 40, 0, 7); ctx.fill();
    }
  }
  ctx.restore(); ctx.restore();
}
function clouds(t, y0, alpha = .18) {
  ctx.save(); ctx.fillStyle = '#ffd0a0';
  for (let i = 0; i < 6; i++) { const x = ((t * (14 + 8 * rnd(i)) + i * 260) % (W + 600)) - 300, y = y0 + rnd(i + 3) * 260;
    ctx.globalAlpha = alpha; for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.ellipse(x + k * 55, y + Math.sin(k) * 14, 80, 34, 0, 0, 7); ctx.fill(); } }
  ctx.restore();
}
function mug(x, y, s, ang, fill = 1, t = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
  // handle
  ctx.lineWidth = 26; ctx.strokeStyle = 'rgba(230,220,195,.85)';
  ctx.beginPath(); ctx.arc(-120, 10, 70, Math.PI - Math.PI / 2.4, Math.PI + Math.PI / 2.4); ctx.stroke();
  // glass body
  ctx.fillStyle = 'rgba(240,230,205,.25)'; ctx.beginPath(); ctx.roundRect(-120, -170, 240, 340, 26); ctx.fill();
  // beer
  ctx.save(); ctx.beginPath(); ctx.roundRect(-108, -158, 216, 316, 20); ctx.clip();
  const top = 158 - 316 * fill;
  const g = ctx.createLinearGradient(0, top, 0, 160); g.addColorStop(0, GOLD); g.addColorStop(1, AMBER2);
  ctx.fillStyle = g; ctx.fillRect(-110, top, 220, 330);
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  for (let i = 0; i < 12; i++) { const by = 150 - ((t * 120 + rnd(i) * 300) % 300); if (by > top + 20) { ctx.beginPath(); ctx.arc(-90 + rnd(i + 4) * 180, by, 3 + 3 * rnd(i), 0, 7); ctx.fill(); } }
  ctx.restore();
  // foam head
  ctx.fillStyle = FOAM;
  for (let i = 0; i < 7; i++) { ctx.beginPath(); ctx.arc(-105 + i * 35, top - 6 + Math.sin(i * 2 + t * 3) * 4, 30, 0, 7); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(-96, -150, 18, 290);
  ctx.restore();
}
function shake(amount, t) { ctx.translate(Math.sin(t * 91) * amount, Math.cos(t * 77) * amount); }
function dust(t, n = 26, alpha = .35) {
  ctx.save(); ctx.fillStyle = '#e8d4a8';
  for (let i = 0; i < n; i++) { const x = (rnd(i) * W + t * (8 + 14 * rnd(i + 2)) + Math.sin(t * .7 + i) * 30) % W;
    const y = (rnd(i + 5) * H - t * (6 + 10 * rnd(i + 8)) + H) % H;
    ctx.globalAlpha = alpha * (.4 + .6 * Math.abs(Math.sin(t * 1.3 + i))); ctx.beginPath(); ctx.arc(x, y, 1.5 + 2.5 * rnd(i + 9), 0, 7); ctx.fill(); }
  ctx.restore();
}

/* ---------- scenes ---------- */
const scenes = [
  { d: 3.80, trans: 'flash', // hook
    draw(t) { background();
      const lv = H - 420 - easeOut(seg(t, 0, 2.2)) * 730;
      ctx.save(); ctx.translate(W / 2, 640); ctx.rotate(Math.sin(t * 3) * .08); const k = 0.85 + .15 * elastic(seg(t, 0, 1)); ctx.scale(k, k);
      text('?', 0, 0, 420, ABRIL, CREAM); ctx.restore();
      wave(lv, t, AMBER, 30, 3.0);
      splash(260, waveY(260, lv, t, 30, 3) , t, .3, 26, 10, .7);
      splash(820, waveY(820, lv, t, 30, 3), t, 1.0, 26, 70, .7);
      pop('ബിയർ', W / 2, 1060, 170, ML, FOAM, t, 2.3, .5, 800, -.2);
    } },
  { d: 3.15, trans: 'wipe',
    draw(t) { background();
      const sl = easeOut(seg(t, 0, .5));
      ctx.save(); ctx.translate(W / 2, 760 + (1 - sl) * 900); ctx.rotate(-.03 - (1 - sl) * .3);
      ctx.fillStyle = '#f2c46d'; ctx.fillRect(-380, -300, 760, 600); ctx.fillRect(-380, -350, 260, 60);
      ctx.fillStyle = '#e0a94a'; ctx.fillRect(-380, -300, 760, 30);
      spaced('KADHA FILES', -250, -320, 30, OSW, INK, 6, 1, 600);
      text('CASE No. 1814', 0, -170, 54, OSW, INK, 'center', 1, 600);
      ctx.fillStyle = 'rgba(22,16,10,.35)'; for (let i = 0; i < 5; i++) ctx.fillRect(-300, -80 + i * 55, (600 - i * 70) * seg(t, .3 + i * .06, .6 + i * .06), 10);
      ctx.restore();
      const s = seg(t, .7, 1.0), sc = 2.6 - 1.6 * easeOut(s);
      if (s > 0) { ink(W / 2, 900, t, 1.0, 300);
        ctx.save(); ctx.translate(W / 2, 900); if (t > 1.0) shake(10 * (1 - seg(t, 1, 1.4)), t);
        ctx.rotate(-.18); ctx.scale(sc, sc); ctx.globalAlpha = s;
        ctx.strokeStyle = RUST; ctx.lineWidth = 10; ctx.strokeRect(-300, -95, 600, 190);
        text('യഥാർത്ഥ സംഭവം', 0, -18, 74, ML, RUST, 'center', 1, 800);
        spaced('TRUE STORY', 0, 52, 40, OSW, RUST, 10, 1, 600); ctx.restore(); }
    } },
  { d: 3.71, trans: 'flash',
    draw(t) { background();
      clouds(t, 160, .14);
      skyline(1180, t, seg(t, 0, .8), t * 18);
      cart(-420 + t * 330, 1180, t);
      ctx.fillStyle = '#140d2a'; ctx.fillRect(-100, 1178, W + 200, 400);
      // slot-machine year
      const p = easeOut(seg(t, 0, 1.1)), n = Math.round(1700 + 114 * p), blur = (1 - p) * 30;
      ctx.save(); ctx.filter = blur > 1 ? `blur(${blur * .3}px)` : 'none';
      text(String(n), W / 2, 520 + Math.sin(t * 40) * blur, 230, ABRIL, CREAM, 'center', seg(t, 0, .3)); ctx.restore();
      if (p >= 1) splash(W / 2, 560, t, 1.1, 0, 0);
      pop('17 OCTOBER', W / 2, 700, 46, OSW, DIM, t, .9, .4, 600);
      pop('ലണ്ടൻ', W / 2, 810, 90, ML, AMBER, t, 1.4, .5, 800, .25);
    } },
  { d: 5.73, trans: 'wipe',
    draw(t) { background();
      const g = easeOut(seg(t, 0, 2.2)), h = (160 + 760 * g) * .86;
      ctx.fillStyle = '#2a1006'; ctx.fillRect(-100, 1040, W + 200, H);
      // light shafts
      ctx.save(); ctx.globalAlpha = .16 + .06 * Math.sin(t * 2); ctx.fillStyle = '#ffd27a';
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(620 + i * 140, 0); ctx.lineTo(700 + i * 140, 0); ctx.lineTo(380 + i * 140, 1040); ctx.lineTo(250 + i * 140, 1040); ctx.fill(); }
      ctx.restore();
      vat(W / 2 - 40, 1040, 520, h);
      // steam from top
      for (let k = 0; k < 8; k++) { const p = (t * .5 + k / 8) % 1; ctx.save(); ctx.globalAlpha = (1 - p) * .18; ctx.fillStyle = '#e9dcc0';
        ctx.beginPath(); ctx.arc(W / 2 - 40 + Math.sin(k * 3 + t) * 120, 1040 - h - 40 - p * 300, 30 + p * 60, 0, 7); ctx.fill(); ctx.restore(); }
      person(W / 2 + 200 + t * 30, 1040, 1.15, '#120c06', t * 8);
      const a = seg(t, 2.0, 2.8);
      if (a > 0) { ctx.save(); ctx.strokeStyle = CREAM; ctx.lineWidth = 4;
        const x = 140, y1 = 1040, y2 = 1040 - h - 14, ya = y1 - (y1 - y2) * easeOut(a);
        ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, ya); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x - 18, ya + 24); ctx.lineTo(x, ya); ctx.lineTo(x + 18, ya + 24); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x - 18, y1 - 24); ctx.lineTo(x, y1); ctx.lineTo(x + 18, y1 - 24); ctx.stroke();
        for (let k = 0; k < 11; k++) { const yy = y1 - (y1 - y2) * k / 11; if (yy > ya) { ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x + 14, yy); ctx.stroke(); } }
        ctx.restore();
        ctx.save(); ctx.translate(86, (y1 + y2) / 2); ctx.rotate(-Math.PI / 2); pop('22 അടി', 0, 0, 58, ML, GOLD, t, 2.6, .45, 800); ctx.restore(); }
    } },
  { d: 3.90, trans: 'flash',
    draw(t) { background();
      const snap = seg(t, 3.3, 3.55);
      ctx.save();
      // creak: growing sway before the snap
      const pre = seg(t, .6, 3.3), sway = Math.sin(t * 22) * .012 * pre * pre;
      if (t > 3.3) shake(16 * (1 - seg(t, 3.3, 4.0)), t);

        const st = seg(t, .9, 1.4); ctx.save(); ctx.strokeStyle = `rgba(255,240,200,${1 - st})`; ctx.lineWidth = 6;
        for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; ctx.beginPath(); ctx.moveTo(W / 2 + Math.cos(a) * (40 + st * 60), 470 + Math.sin(a) * (40 + st * 60)); ctx.lineTo(W / 2 + Math.cos(a) * (90 + st * 140), 470 + Math.sin(a) * (90 + st * 140)); ctx.stroke(); }
        ctx.restore(); pop('ചിയേഴ്സ്!', W / 2, 260, 80, ML, GOLD, t, .92, .3, 800, .2); }
      pop('ബിയർ പ്രേമിയായ', W / 2, 1010, 74, ML, CREAM, t, 1.2, .4, 800);

let acc = 0; for (const s of scenes) { s.start = acc; acc += s.d; }
const TOTAL = acc;

/* small, word-synced captions */
function caption(t) {
  const c = (window.CAPS || []).find(c => t >= c.s && t < c.e); if (!c) return;
  const size = 40, y = 1385;
  ctx.save(); ctx.font = `800 ${size}px ${ML}`; ctx.textBaseline = 'middle';
  const gap = ctx.measureText(' ').width, widths = c.w.map(w => ctx.measureText(w.t).width);

    ctx.textAlign = 'left'; ctx.fillText(w.t, x, y + 2); x += widths[i] + gap;

}

/* transitions: 'wipe' = beer floods up over the cut and drains away; 'flash' = white pop; 'fade' = dip to dark */
function transitionOut(sc, lt, t) {
  const p = seg(lt, sc.d - .32, sc.d);
  if (p <= 0) return;
  if (sc.trans === 'wipe') wave(H + 120 - easeIn(p) * (H + 420), t, AMBER, 40, 4);
  else if (sc.trans === 'fade') { ctx.fillStyle = `rgba(10,7,4,${p})`; ctx.fillRect(0, 0, W, H); }
  else if (sc.trans === 'flash') { const q = seg(lt, sc.d - .1, sc.d); ctx.fillStyle = `rgba(255,244,222,${q * .9})`; ctx.fillRect(0, 0, W, H); }

function transitionIn(prev, lt, t) {

  else if (prev.trans === 'flash') { ctx.fillStyle = `rgba(255,244,222,${(1 - p) * .9})`; ctx.fillRect(0, 0, W, H); }
}

function frame(t) {

}
window.TOTAL = TOTAL; window.FPS = FPS; window.frame = frame;
window.grab = (t) => { frame(t); return cv.toDataURL('image/jpeg', 0.92); };
