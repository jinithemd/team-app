# Checks the Clbx phone apps still build. Android: a test APK you can install (download it
# from the run's Artifacts). iPhone: a simulator build (store builds run on Codemagic).
name: Phone apps

on:
  push:
    branches: [main]
    paths: ["android/**", "ios/**", "capacitor.config.ts", "package.json", "package-lock.json", ".github/workflows/app.yml"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: Firebase config (push notifications), if set
        env: { GOOGLE_SERVICES_JSON: "${{ secrets.GOOGLE_SERVICES_JSON }}" }
        run: '[ -n "$GOOGLE_SERVICES_JSON" ] && echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json || echo "no google-services.json: building without push"'
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: { name: clbx-android-debug, path: android/app/build/outputs/apk/debug/*.apk }

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx cap sync ios
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
        shell: bash -o pipefail {0}
